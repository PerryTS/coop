name: Linux shared-runtime proof

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Scoped to pull requests, and keyed by SHA rather than ref for everything
  # else. Both halves matter, and this job had neither.
  #
  # `github.ref` is constant on `main`, so every merge landed in the same
  # concurrency group as the previous one and cancelled it. With an
  # unconditional `cancel-in-progress`, and a runner queue that has held jobs
  # for over an hour here, a normal merge day cancels each `main` run before it
  # reaches a runner -- the proof never executes and never reports. Run
  # 31950622999 is an instance: cancelled after 20 seconds by the next merge.
  #
  # Cancelling a superseded *pull request* run is still right: it is the same
  # branch, re-pushed, and the older result is genuinely obsolete.
  group: linux-shared-runtime-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-elf:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22 and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          . /etc/os-release
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm22.list >/dev/null
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            clang-22 llvm-22-dev libpolly-22-dev libzstd-dev libunwind-dev \
            pkg-config libssl-dev zlib1g-dev
          prefix="$(llvm-config-22 --prefix)"
          llvm-config-22 --version | grep -q '^22\.'
          # apt.llvm.org now ships `$prefix/bin/clang` itself, and `/usr/bin/clang-22`
          # resolves to that same file -- so `ln -sf` refuses with "are the same
          # file", exit 1, and `set -e` kills the job during dependency install.
          # That is how this proof came to fail before running a single step of
          # what it exists to prove.
          #
          # What the build actually needs is a usable `clang` on `$prefix/bin`
          # (added to PATH below). So assert THAT, and only create the link when
          # it is missing. Asserting the postcondition rather than the success of
          # the `ln` is the point: the packaging can change again, and a check on
          # the end state survives it either way.
          if ! "$prefix/bin/clang" --version >/dev/null 2>&1; then
            sudo ln -sf /usr/bin/clang-22 "$prefix/bin/clang"
          fi
          "$prefix/bin/clang" --version | grep -qE '\bversion 22\.' || {
            echo "::error::$prefix/bin/clang is missing or is not LLVM 22:"
            "$prefix/bin/clang" --version || true
            exit 1
          }
          echo "LLVM_SYS_221_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Check out the pinned Perry revision
        shell: bash
        run: |
          set -euo pipefail
          commit="$(sed -n 's/^commit = "\([0-9a-f]*\)"/\1/p' perry-main.lock)"
          test -n "$commit"
          git init .perry-main
          git -C .perry-main remote add origin https://github.com/PerryTS/perry.git
          git -C .perry-main fetch --depth 1 origin "$commit"
          git -C .perry-main checkout --detach FETCH_HEAD
          test "$(git -C .perry-main rev-parse HEAD)" = "$commit"

      # `rustup toolchain install` with no argument reads `rust-toolchain.toml`.
      # This job builds perry-runtime itself (through the providers and through
      # coop-daemon/coop-worker), so it fails outright on a channel other than
      # the one Perry pins -- assert the two files agree before spending an hour.
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          ours="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          theirs="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' .perry-main/rust-toolchain.toml)"
          test -n "$ours" && test -n "$theirs"
          if [ "$ours" != "$theirs" ]; then
            echo "::error::rust-toolchain.toml pins $ours but Perry at perry-main.lock pins $theirs"
            exit 1
          fi
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      - name: Build separate providers and server
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-perry-libraries.sh
          test -z "$(git -C .perry-main status --short)"
          cargo build --release -p coop-daemon -p coop-worker
          scripts/prepare-resource-benchmark.sh

      - name: Prove ELF provider and application boundaries
        shell: bash
        run: |
          set -euo pipefail
          runtime=var/coop/lib/libperry_runtime.so
          stdlib=var/coop/lib/libperry_stdlib.so
          app="$(find target/dynamic-smoke/compiled/test1 -mindepth 2 -maxdepth 2 -name app.so -print -quit)"
          test -f "$runtime" -a -f "$stdlib" -a -f "$app"
          readelf -d "$runtime" | grep -F 'SONAME' | grep -F 'libperry_runtime.so'
          readelf -d "$stdlib" | grep -F 'NEEDED' | grep -F 'libperry_runtime.so'
          readelf -d "$app" | grep -F 'NEEDED' | grep -F 'libperry_runtime.so'
          readelf -d "$app" | grep -F 'NEEDED' | grep -F 'libperry_stdlib.so'
          nm -D --defined-only "$app" | awk '{print $3}' | sort > /tmp/coop-app-exports.txt
          test "$(wc -l < /tmp/coop-app-exports.txt)" -eq 2
          grep -Fx coop_app_http_v2 /tmp/coop-app-exports.txt
          grep -Fx perry_module_init /tmp/coop-app-exports.txt

      # Every step below this one runs through `run-in-delegated-cgroup.sh`, so a
      # failure here skips the entire proof: the loader/integrity/lifecycle
      # tests and both RSS matrices. It is worth being loud.
      #
      # It previously was not. The step was a bare sequence under
      # `set -euo pipefail` in which the two most likely failures --
      # `test -f "$parent/cgroup.controllers"` and `grep -qw "$controller"` --
      # both produce NO output. It exited 1 in about 30 ms having printed
      # nothing at all, which says only "cgroups, somehow".
      #
      # Two real hazards, neither of which the original distinguished:
      #
      #  1. The parent derived from /proc/self/cgroup need not be a delegable
      #     cgroup-v2 directory. Under a cgroup namespace the path is relative
      #     to the namespace root, and on a hybrid/v1 host there is no unified
      #     `cgroup.controllers` at all.
      #  2. A freshly created child inherits ONLY the controllers its parent
      #     advertises in `cgroup.subtree_control`. If the parent has not
      #     enabled memory/cpu/pids, the child's `cgroup.controllers` is EMPTY
      #     and the `grep -qw` loop fails -- silently, and for a reason that
      #     has nothing to do with the child.
      #
      # So: probe explicitly, enable the controllers in the parent before
      # creating the child, and name the exact unmet condition on failure.
      - name: Delegate a cgroup-v2 subtree for worker enforcement
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::cgroup environment"
          echo "--- /proc/self/cgroup"; cat /proc/self/cgroup || true
          echo "--- unified mount"; grep -E 'cgroup2? ' /proc/self/mounts || true
          echo "::endgroup::"

          relative="$(awk -F: '$1 == "0" { print $3 }' /proc/self/cgroup)"
          if [ -z "$relative" ]; then
            echo "::error::/proc/self/cgroup has no unified (0::) entry."
            echo "::error::This host is not running a cgroup-v2 unified hierarchy."
            exit 1
          fi

          # A candidate parent is one we can actually DELEGATE FROM, which is a
          # stronger property than having a `cgroup.controllers` file.
          #
          # cgroup-v2's "no internal process" rule forbids enabling
          # `cgroup.subtree_control` on a cgroup that contains processes. On a
          # GitHub-hosted runner the job runs inside
          # `system.slice/hosted-compute-agent.service`, which therefore returns
          # EBUSY ("Device or resource busy") and leaves the child with EMPTY
          # controllers -- even though the parent advertises all five. The root
          # cgroup is exempt from that rule, so it is the usable fallback.
          #
          # So: try each candidate end to end and keep the first that yields a
          # child actually carrying memory, cpu and pids. Testing the property
          # we need beats testing a proxy for it -- the previous version checked
          # for `cgroup.controllers`, which was present on a parent that could
          # not delegate, so it never reached the fallback.
          root=""
          for candidate in "/sys/fs/cgroup${relative}" "/sys/fs/cgroup"; do
            [ -f "${candidate}/cgroup.controllers" ] || {
              echo "candidate rejected (no cgroup.controllers): $candidate"
              continue
            }
            echo "--- trying parent: $candidate"
            echo "    controllers     : $(cat "$candidate/cgroup.controllers" 2>/dev/null || echo '<unreadable>')"
            echo "    subtree_control : $(cat "$candidate/cgroup.subtree_control" 2>/dev/null || echo '<empty>')"

            missing=""
            for controller in memory cpu pids; do
              grep -qw "$controller" "$candidate/cgroup.controllers" || missing="$missing $controller"
            done
            if [ -n "$missing" ]; then
              echo "    rejected: parent does not offer:$missing"
              continue
            fi

            if ! echo '+memory +cpu +pids' | sudo tee "$candidate/cgroup.subtree_control" >/dev/null 2>&1; then
              echo "    rejected: cannot enable subtree_control (likely EBUSY --"
              echo "              cgroup-v2 forbids it on a cgroup holding processes)"
              continue
            fi

            attempt="${candidate}/coop-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            sudo mkdir -p "$attempt"
            child_controllers="$(cat "$attempt/cgroup.controllers" 2>/dev/null || true)"
            echo "    child controllers: ${child_controllers:-<empty>}"

            child_missing=""
            for controller in memory cpu pids; do
              grep -qw "$controller" <<<"$child_controllers" || child_missing="$child_missing $controller"
            done
            if [ -n "$child_missing" ]; then
              echo "    rejected: delegated child lacks:$child_missing"
              sudo rmdir "$attempt" 2>/dev/null || true
              continue
            fi

            root="$attempt"
            echo "    ACCEPTED"
            break
          done

          if [ -z "$root" ]; then
            echo "::error::No cgroup-v2 parent could delegate memory+cpu+pids."
            echo "::error::Tried /sys/fs/cgroup${relative} and /sys/fs/cgroup; see the"
            echo "::error::per-candidate rejection reasons above."
            exit 1
          fi

          echo '+memory +cpu +pids' | sudo tee "$root/cgroup.subtree_control" >/dev/null
          sudo chown "$(id -u):$(id -g)" \
            "$root" "$root/cgroup.procs" "$root/cgroup.subtree_control"
          echo "delegated: $root"
          echo "COOP_DELEGATED_CGROUP_ROOT=${root}" >> "$GITHUB_ENV"
          echo "COOP_TEST_CGROUP_ROOT=${root}/workers" >> "$GITHUB_ENV"
          echo "COOP_BENCH_CGROUP_ROOT=${root}/benchmarks" >> "$GITHUB_ENV"

      - name: Capture exact Linux benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(mktemp)"
          scripts/capture-linux-benchmark-environment.sh > "$metadata"
          mv "$metadata" linux-benchmark-environment.txt

      - name: Loader, integrity, and lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          scripts/run-in-delegated-cgroup.sh bash -c '
            set -euo pipefail
            cargo test -p coop-host-abi
            cargo test -p coop-worker --test provider_integrity -- --nocapture
            cargo test -p coop-daemon --bin coop cgroup::tests -- --nocapture
            cargo test -p coop-worker --test plugin_roundtrip shared_runtime_app_roundtrip -- --nocapture
            cargo test -p coop-worker --test plugin_roundtrip repeated_load_dispatch_shutdown_reclaims_executor_threads -- --ignored --nocapture
            cargo test -p coop-daemon --test auto_compile -- --nocapture
            cargo test -p coop-worker --test plugin_roundtrip hundred_preloaded_apps_dispatch -- --ignored --nocapture
          '

      - name: Linux Perry 1/10/100 RSS, PSS, private-dirty, and cgroup evidence
        shell: bash
        env:
          COOP_BENCH_APP_COUNTS: 1,10,100
          COOP_BENCH_TRIALS: "2"
          COOP_BENCH_REQUESTS: "2000"
          COOP_BENCH_PRELOAD_CONCURRENCY: "4"
        run: |
          set -euo pipefail
          scripts/run-in-delegated-cgroup.sh bash -c '
            set -euo pipefail
            cargo test --release -p coop-daemon --test resource_benchmark \
              measure_in_process_startup_and_rss -- --ignored --nocapture \
              2>&1 | tee linux-resource-results.txt
          '

      - name: Linux Node consolidated and isolated RSS, PSS, private-dirty, and cgroup evidence
        shell: bash
        env:
          COOP_BENCH_NODE_SCENARIOS: 1x1,1x10,1x100,10x1,100x1
          COOP_BENCH_TRIALS: "2"
          COOP_BENCH_REQUESTS: "2000"
        run: |
          set -euo pipefail
          scripts/run-in-delegated-cgroup.sh bash -c '
            set -euo pipefail
            cargo test --release -p coop-daemon --test node_resource_benchmark \
              measure_node_process_startup_and_rss -- --ignored --nocapture \
              2>&1 | tee linux-node-resource-results.txt
          '

      - name: Upload raw Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-shared-runtime-evidence
          path: |
            linux-resource-results.txt
            linux-node-resource-results.txt
            linux-benchmark-environment.txt
            target/dynamic-smoke/prepare.log
          if-no-files-found: warn
