name: Fast check

# A minutes-scale gate for every PR.
#
# The Linux shared-runtime proof is the real end-to-end evidence, but it needs
# LLVM 22, a Perry checkout, provider builds and cgroup delegation, and it is
# budgeted at two hours. Nothing in this repository gave a contributor feedback
# before that finished.
#
# coop-host-abi, coop-worker and coop-cli have NO Perry dependency — the
# worker loads application images with dlopen at runtime rather than linking
# them — so they build, lint and test with a stock Rust toolchain in minutes.
# coop-daemon and perry-stdlib-shared do depend on Perry and stay with the
# proof job.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancellation is scoped to pull requests on purpose. Cancelling `main` runs
  # means a busy merge day can cancel every run before it reaches a runner and
  # leave a gate that has never actually executed.
  group: fast-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Perry-free crates only; see the header.
  PERRY_FREE_CRATES: "-p coop-host-abi -p coop-worker -p coop-cli"

jobs:
  fast-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      # Cargo resolves the WHOLE workspace before building any member, so
      # `perry-stdlib-shared`'s path dependency on `perry-ffi` must exist even
      # though nothing this job builds depends on Perry. A depth-1 fetch of the
      # pinned commit is enough: the manifests need to be readable, not built.
      #
      # Validating this gate locally passed without it only because `.perry-main`
      # already existed as an untracked worktree — exactly the "worked on my
      # machine because of untracked state" failure this step now prevents.
      - name: Check out the pinned Perry revision (manifests only)
        shell: bash
        run: |
          set -euo pipefail
          commit="$(sed -n 's/^commit = "\([0-9a-f]*\)"/\1/p' perry-main.lock)"
          test -n "$commit"
          git init .perry-main
          git -C .perry-main remote add origin https://github.com/PerryTS/perry.git
          git -C .perry-main fetch --depth 1 origin "$commit"
          git -C .perry-main checkout --detach FETCH_HEAD
          test "$(git -C .perry-main rev-parse HEAD)" = "$commit"

      - uses: Swatinem/rust-cache@v2
        with:
          key: fast-check

      # Formatting covers the whole workspace: it parses, it does not build, so
      # the Perry-dependent crates cost nothing here.
      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (Perry-free crates)
        run: cargo clippy ${PERRY_FREE_CRATES} --all-targets -- -D warnings

      # --no-fail-fast is not optional in this repository: without it the run
      # stops at the first failing target and silently skips the remaining
      # worker test binaries, which reads as a pass.
      #
      # Three coop-worker suites -- plugin_roundtrip, provider_integrity and
      # binary_http_roundtrip -- load real application dylibs against built
      # Perry provider images. They cannot run without those artifacts and
      # belong to the shared-runtime proof job, not to a fast gate.
      #
      # This is an EXCLUDE list, not a run list. It was a run list, and that is
      # a gate hole: `runtime_package_behavior` (11 Perry-free tests covering kv
      # and storage) was added by a PR and simply never ran here, because
      # nothing added it to the list. A whitelist of what to run makes a new
      # suite invisible by default; a blocklist of what to skip makes it run by
      # default and forces a deliberate edit to exclude it.
      #
      # The named-suite check below then fails if an excluded suite disappears,
      # so a rename cannot leave a stale exclusion silently skipping nothing.
      - name: Tests (Perry-free crates, provider suites excluded)
        shell: bash
        run: |
          set -euo pipefail
          provider_suites=(plugin_roundtrip provider_integrity binary_http_roundtrip)

          present="$(ls crates/coop-worker/tests/*.rs | xargs -n1 basename | sed 's/\.rs$//')"
          for suite in "${provider_suites[@]}"; do
            grep -qx "$suite" <<<"$present" || {
              echo "::error::Excluded provider suite '$suite' no longer exists."
              echo "::error::Delete it from provider_suites, or the exclusion is skipping nothing."
              exit 1
            }
          done

          cargo test -p coop-host-abi --no-fail-fast
          cargo test -p coop-cli --no-fail-fast
          cargo test -p coop-worker --lib --no-fail-fast

          while read -r suite; do
            skip=""
            for p in "${provider_suites[@]}"; do [ "$p" = "$suite" ] && skip=1; done
            [ -n "$skip" ] && { echo "skipping provider suite: $suite"; continue; }
            echo "::group::coop-worker --test $suite"
            cargo test -p coop-worker --test "$suite" --no-fail-fast
            echo "::endgroup::"
          done <<<"$present"

      # Several suites self-skip when their fixtures are absent (no providers,
      # no compiled Perry). A skip is an early `return`, which counts as a pass
      # in the summary line -- so surface them rather than letting a green run
      # hide that nothing executed.
      - name: Report self-skipped suites
        if: always()
        run: |
          # Case-insensitive and unanchored on purpose: this repository prints
          # BOTH `skip:` and `SKIP:`, and an anchored lowercase pattern silently
          # saw only half of them -- a skip-detector that cannot see skips is the
          # exact failure this step exists to catch.
          cargo test -p coop-host-abi -p coop-cli -p coop-worker --no-fail-fast -- --nocapture 2>&1 \
            | grep -iE 'skip:' || echo "no suites self-skipped"

      - name: TypeScript runtime package typechecks
        run: |
          if [ -f packages/coop-runtime/package.json ]; then
            cd packages/coop-runtime
            npm ci --silent || npm install --silent
            npx --yes tsc --noEmit || {
              echo "::warning::@coop/runtime does not typecheck under tsc."
              echo "::warning::Note this is advisory: Perry compiles a subset, so tsc is neither necessary nor sufficient."
              exit 0
            }
          else
            echo "no packages/coop-runtime/package.json — skipping"
          fi

      - name: Documentation builds
        run: |
          if [ -f docs/book.toml ]; then
            curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
              | tar -xz -C /usr/local/bin
            mdbook build docs
          else
            echo "no docs/book.toml — skipping"
          fi
