[workspace]
resolver = "2"
members = [
    "crates/perch-host-abi",
    "crates/perch-worker",
    "crates/perch-daemon",
    "crates/perch-cli",
    "crates/perry-stdlib-shared",
    # perch-derisk-host is the Phase A.2 experiment that proved plugin roundtrip
    # works from Rust. Kept in the workspace so it builds against the same
    # perry-runtime version as the real crates.
    "scripts/derisk/host-rust",
]
default-members = [
    "crates/perch-daemon",
    "crates/perch-worker",
    "crates/perch-cli",
]
exclude = [".perry-main", ".celld-main", ".perry-examples-main"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/skelpo/perch"
rust-version = "1.75"

[workspace.dependencies]
# Pinned Perry sources used only to package the provider libraries. The daemon
# and worker deliberately do not link these crates.
perry-runtime = { path = ".perry-main/crates/perry-runtime" }
perry-stdlib = { path = ".perry-main/crates/perry-stdlib", default-features = false, features = ["full"] }
perry-ffi = { path = ".perry-main/crates/perry-ffi" }

# perch crates depend on each other by workspace path
perch-host-abi = { path = "crates/perch-host-abi" }

# Common deps shared across perch crates
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false

# Compiler identity hashing reads a large Perry dev binary. Keep this one
# primitive optimized even in Perch's debug/test builds.
[profile.dev.package.sha2]
opt-level = 3

# Exact-profile pair for the deployable Perry stdlib. LTO must remain off so
# runtime calls stay interposable onto the separately loaded runtime image.
[profile.perry-shared]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
panic = "abort"
strip = false
