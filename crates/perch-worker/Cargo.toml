[package]
name = "perch-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Per-deployment host process: dlopens the deployment dylib and dispatches daemon-forwarded requests"

[[bin]]
name = "perch-worker"
path = "src/main.rs"

[dependencies]
perch-host-abi = { workspace = true }
perry-runtime = { workspace = true }

tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# For building DeploymentRequest/Response body base64
base64 = "0.22"

# dlopen/dlsym for v0.5 direct-call model
libc = "0.2"

# CLI parsing
clap = { version = "4", features = ["derive"] }

[profile.release]
# Worker-specific overrides if needed
