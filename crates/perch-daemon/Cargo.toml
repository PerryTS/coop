[package]
name = "perch-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Perch supervisor daemon: HTTP listener, deployment watcher, worker spawner"

[[bin]]
name = "perch"
path = "src/main.rs"

[dependencies]
perch-host-abi = { workspace = true }
perch-app-host = { package = "perch-worker", path = "../perch-worker" }

tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
bytes = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
libc = "0.2"
arc-swap = "1"

# Config parsing
toml = "0.8"

# HTTP server + middleware
axum = { version = "0.7", features = ["macros", "json"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "trace", "set-header", "cors"] }
hyper = { version = "1", features = ["full"] }

# File watching for deployment hot reload (used in follow-up to Checkpoint 2)
notify = "6"
notify-debouncer-mini = "0.4"

# Base64 for body encoding
base64 = "0.22"
bcrypt = "0.17"

# TLS via rustls + ACME (Let's Encrypt)
rustls = "0.23"
tokio-rustls = "0.26"
rustls-acme = { version = "0.11", features = ["axum"] }

# HTTP client for Bunny CDN API + edge IP allowlist
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# HTML templating for admin UI
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"

# Prometheus metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# SQLite for schema provisioning + migration runner.
# Match perry-stdlib's version to avoid libsqlite3-sys "links" conflict.
rusqlite = { version = "0.37", features = ["bundled"] }

# Chrono for timestamps in admin UI
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"

# CLI parsing
clap = { version = "4", features = ["derive", "env"] }

# Async traits
async-trait = "0.1"

# Unique ID generation for request IDs
nanoid = "0.4"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tempfile = "3"
tokio-postgres = "0.7.18"
