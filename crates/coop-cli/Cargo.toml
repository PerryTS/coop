[package]
name = "coop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Coop CLI: dev, deploy, logs, status, rollback"

[[bin]]
name = "coop-cli"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
# `env` is required by `#[arg(long, env = "COOP_URL", ...)]` in main.rs.
# Without it clap's derive expands to an `Arg::env` call that does not exist
# and the crate fails to compile.
clap = { version = "4", features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
