# Perch deployment manifest for the Next.js benchmark fixture.
#
# scripts/prepare-next-benchmark.sh stages this file plus perch-handler.ts
# (as handlers/main.ts) and app/api/benchmark/route.ts into a deployment
# directory, then lets the Perch daemon compile and publish the application
# library itself. Nothing about this fixture is hand-built.
name = "next-bench"

[hosts]
domains = ["benchmark.local"]

[[handlers]]
file = "handlers/main.ts"
path = "/api/benchmark"
method = "GET"
