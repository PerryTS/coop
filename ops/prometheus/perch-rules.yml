groups:
  - name: perch-recording
    interval: 30s
    rules:
      - record: perch:http_request_rate5m
        expr: sum by (deployment) (rate(perch_requests_total[5m]))

      - record: perch:http_error_ratio5m
        expr: |
          sum by (deployment) (rate(perch_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum by (deployment) (rate(perch_requests_total[5m])), 0.001)

      - record: perch:http_latency_p95_seconds5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (deployment, le) (rate(perch_request_duration_seconds_bucket[5m]))
          )

      - record: perch:executor_queue_utilization
        expr: |
          perch_executor_queue_depth
          /
          clamp_min(perch_executor_queue_capacity, 1)

      - record: perch:queue_failed_delivery_ratio5m
        expr: |
          sum by (deployment, queue) (
            rate(perch_queue_deliveries_total{outcome!="ack"}[5m])
          )
          /
          clamp_min(
            sum by (deployment, queue) (rate(perch_queue_deliveries_total[5m])),
            0.001
          )

  - name: perch-alerts
    interval: 30s
    rules:
      - alert: PerchMetricSurfaceMissing
        expr: absent_over_time(perch_deployments_total[5m]) == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Perch metrics have disappeared
          description: No perch_deployments_total sample has been scraped for five minutes.
          runbook: ops/RUNBOOK.md#perchmetricsurfacemissing

      - alert: PerchHttpErrorRateHigh
        expr: |
          (
            sum by (deployment) (rate(perch_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum by (deployment) (rate(perch_requests_total[5m])), 0.001)
          ) > 0.05
          and
          sum by (deployment) (rate(perch_requests_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Perch HTTP error ratio is high
          description: Deployment {{ $labels.deployment }} has exceeded 5% HTTP 5xx responses for ten minutes.
          runbook: ops/RUNBOOK.md#perchhttperrorratehigh

      - alert: PerchExecutorQueueSaturated
        expr: |
          perch_executor_queue_depth
          /
          clamp_min(perch_executor_queue_capacity, 1) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Perch executor queue is saturated
          description: Deployment {{ $labels.deployment }} has remained above 90% executor queue use for ten minutes.
          runbook: ops/RUNBOOK.md#perchexecutorqueuesaturated

      - alert: PerchWorkerTransportBacklogged
        expr: perch_worker_transport_backlog > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Perch worker transport is continuously backlogged
          description: Deployment {{ $labels.deployment }} has waited continuously for its ordered worker connection for five minutes.
          runbook: ops/RUNBOOK.md#perchworkertransportbacklogged

      - alert: PerchWorkerTransportCancelledActive
        expr: sum by (deployment, entrypoint) (increase(perch_worker_transport_cancellations_total{phase="active"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: An active Perch worker exchange was cancelled
          description: Deployment {{ $labels.deployment }} dropped an active {{ $labels.entrypoint }} exchange; its ordered connection has been poisoned and must be replaced.
          runbook: ops/RUNBOOK.md#perchworkertransportcancelledactive

      - alert: PerchAdmissionRejections
        expr: sum by (deployment, entrypoint, reason) (increase(perch_invocation_rejections_total[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Perch rejected admitted work
          description: Deployment {{ $labels.deployment }} rejected {{ $value }} {{ $labels.entrypoint }} invocations in ten minutes ({{ $labels.reason }}).
          runbook: ops/RUNBOOK.md#perchadmissionrejections

      - alert: PerchInvocationTimeouts
        expr: sum by (deployment, entrypoint) (increase(perch_invocation_timeouts_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Perch invocation deadline exceeded
          description: Deployment {{ $labels.deployment }} timed out {{ $value }} {{ $labels.entrypoint }} invocations in five minutes.
          runbook: ops/RUNBOOK.md#perchinvocationtimeouts

      - alert: PerchActivationUnhealthy
        expr: perch_deployment_activation_healthy == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Perch deployment activation is unhealthy
          description: Deployment {{ $labels.deployment }} failed its latest activation probe.
          runbook: ops/RUNBOOK.md#perchactivationunhealthy

      - alert: PerchWorkerCrashLoop
        expr: sum by (deployment) (increase(perch_worker_restarts_total[10m])) >= 3
        labels:
          severity: critical
        annotations:
          summary: Perch worker is restarting repeatedly
          description: Deployment {{ $labels.deployment }} restarted at least three times in ten minutes.
          runbook: ops/RUNBOOK.md#perchworkercrashloop

      - alert: PerchShardFailure
        expr: sum by (slot, reason) (increase(perch_worker_shard_failures_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Perch worker shard failed
          description: Shard {{ $labels.slot }} failed in the last five minutes ({{ $labels.reason }}); resident deployments may be recovering.
          runbook: ops/RUNBOOK.md#perchshardfailure

      - alert: PerchWorkerOomKilled
        expr: perch_worker_cgroup_memory_oom_kill_events > 0
        labels:
          severity: critical
        annotations:
          summary: Perch worker cgroup recorded an OOM kill
          description: Deployment {{ $labels.deployment }} has an OOM-kill event in its current worker cgroup.
          runbook: ops/RUNBOOK.md#perchworkeroomkilled

      - alert: PerchQueueBacklogOld
        expr: perch_queue_oldest_visible_age_seconds > 60
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Perch queue backlog is old
          description: Queue {{ $labels.deployment }}/{{ $labels.queue }} has retained visible work older than 60 seconds for 15 minutes.
          runbook: ops/RUNBOOK.md#perchqueuebacklogold

      - alert: PerchQueuePoolSaturated
        expr: perch_queue_pool_utilization_ratio > 0.9 or perch_queue_pool_waiters > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Perch durable-queue connection pool is saturated
          description: The shared queue pool has remained above 90% checked-out capacity or has waiting borrowers for five minutes.
          runbook: ops/RUNBOOK.md#perchqueuepoolsaturated

      - alert: PerchQueueDeadLetters
        expr: perch_queue_dead_letters > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Perch queue contains dead letters
          description: Queue {{ $labels.deployment }}/{{ $labels.queue }} contains {{ $value }} dead letters.
          runbook: ops/RUNBOOK.md#perchqueuedeadletters

      - alert: PerchQueueStoreErrors
        expr: sum by (operation) (increase(perch_queue_store_errors_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Perch durable queue store failed
          description: Queue-store operation {{ $labels.operation }} failed {{ $value }} times in five minutes.
          runbook: ops/RUNBOOK.md#perchqueuestoreerrors

      - alert: PerchRollbackFailed
        expr: sum by (deployment) (increase(perch_deployment_rollbacks_total{outcome="failure"}[15m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Perch deployment rollback failed
          description: Deployment {{ $labels.deployment }} failed a rollback in the last 15 minutes.
          runbook: ops/RUNBOOK.md#perchrollbackfailed

      - alert: PerchArtifactCollectionFailed
        expr: sum by (deployment) (increase(perch_artifact_collections_total{outcome="failure"}[30m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Perch artifact collection failed
          description: Deployment {{ $labels.deployment }} failed artifact collection in the last 30 minutes.
          runbook: ops/RUNBOOK.md#perchartifactcollectionfailed
