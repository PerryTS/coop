<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Coop</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Welcome to Coop</h1>
    <p>A single binary that replaces seven droplets and a dozen Docker containers.</p>

    <h2>Get in Touch</h2>
    <form action="/contact" method="POST">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" required placeholder="What's on your mind?"></textarea>

      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
